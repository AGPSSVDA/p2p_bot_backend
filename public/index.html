<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>P2P Bot — Manual Cancel Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: ui-sans-serif, system-ui, -apple-system; }
    .badge { padding: 0.125rem 0.5rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">

  <header class="border-b border-gray-800 px-6 py-4">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold">P2P Bot — Manual Cancel Dashboard</h1>
        <p class="text-sm text-gray-400">Test order cancellation via the bot's signed Binance API.</p>
      </div>
      <div class="text-right">
        <div id="health" class="text-xs text-gray-500">checking…</div>
        <button id="refreshBtn"
          class="mt-1 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 px-4 py-1.5 rounded text-sm font-medium">
          🔄 Refresh
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-6">
    <div id="orders" class="grid grid-cols-1 lg:grid-cols-2 gap-4"></div>
    <div id="empty" class="hidden text-center text-gray-500 py-16 border border-dashed border-gray-800 rounded">
      <div class="text-5xl mb-3">📭</div>
      <div>No active orders right now.</div>
      <div class="text-xs mt-1">Place a test order on the BUY ad and refresh.</div>
    </div>
  </main>

  <!-- ── Cancel modal ──────────────────────────────────────────────────── -->
  <div id="cancelModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
    <div class="bg-gray-900 border border-gray-700 rounded-lg max-w-lg w-full p-6 shadow-2xl">
      <h2 class="text-lg font-bold mb-1">Cancel Order</h2>
      <p class="text-xs text-gray-500 mb-4">Order: <span id="modalOrderNo" class="font-mono"></span></p>

      <label class="block mb-1 text-sm font-medium">Reason Code</label>
      <select id="reasonCode" class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 mb-1 text-sm">
        <optgroup label="🟢 Due to seller — recommended (no rate impact)">
          <option value="6" selected>6 — Seller cannot release the order</option>
          <option value="4">4 — Seller's payment method issue</option>
          <option value="3">3 — Seller asking extra fee</option>
        </optgroup>
        <optgroup label="🔴 Due to buyer — will increase YOUR cancel rate">
          <option value="1">1 — I changed mind / don't want to trade</option>
          <option value="2">2 — I don't meet seller's requirement</option>
          <option value="5">5 — Other</option>
        </optgroup>
      </select>
      <p id="reasonHint" class="text-xs text-gray-500 mb-4"></p>

      <label class="block mb-1 text-sm font-medium">Additional info (visible to seller)</label>
      <input id="additionalInfo"
        class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 mb-4 text-sm"
        value="No response from seller — Manual cancel via dashboard"
        maxlength="200" />

      <div class="flex gap-2 justify-end">
        <button id="modalCloseBtn"
          class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded text-sm font-medium">Close</button>
        <button id="modalConfirmBtn"
          class="bg-red-600 hover:bg-red-700 disabled:bg-gray-700 disabled:text-gray-500 px-4 py-2 rounded text-sm font-medium">
          ⚠ Confirm Cancel
        </button>
      </div>
    </div>
  </div>

  <!-- ── Toast ─────────────────────────────────────────────────────────── -->
  <div id="toast"
    class="hidden fixed bottom-6 right-6 bg-gray-800 border-l-4 px-4 py-3 rounded shadow-2xl max-w-md text-sm z-50">
  </div>

  <script>
    const $ = sel => document.querySelector(sel);
    const state = { activeOrderNo: null };

    function fmtINR(n) {
      const num = Number(n);
      return isNaN(num) ? n : '₹' + num.toLocaleString('en-IN', { maximumFractionDigits: 2 });
    }
    function fmtTime(ts) {
      if (!ts) return '—';
      return new Date(ts).toLocaleString('en-IN', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: 'short' });
    }
    function relTime(ts) {
      if (!ts) return '';
      const diff = ts - Date.now();
      const m = Math.round(diff / 60000);
      if (m > 0) return 'in ' + m + ' min';
      return Math.abs(m) + ' min ago';
    }
    function badge(text, color) {
      return `<span class="badge bg-${color}-900/40 text-${color}-300 border border-${color}-800">${text}</span>`;
    }

    async function loadHealth() {
      try {
        const r = await fetch('/api/health').then(r => r.json());
        $('#health').textContent = `✅ healthy — ${r.botActive} active in bot`;
        $('#health').className = 'text-xs text-emerald-400';
      } catch (e) {
        $('#health').textContent = '❌ backend unreachable';
        $('#health').className = 'text-xs text-red-400';
      }
    }

    async function loadOrders() {
      try {
        const r = await fetch('/api/orders').then(r => r.json());
        if (!r.success) throw new Error(r.error);
        renderOrders(r.orders || []);
      } catch (e) {
        toast('Failed to load orders: ' + e.message, 'red');
      }
    }

    function renderOrders(orders) {
      const wrap = $('#orders');
      const empty = $('#empty');
      if (!orders.length) {
        wrap.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');
      wrap.innerHTML = orders.map(o => `
        <div class="bg-gray-900 border border-gray-800 rounded-lg p-4 hover:border-gray-700 transition">
          <div class="flex justify-between items-start mb-3">
            <div>
              <div class="text-xs text-gray-500 font-mono">${o.orderNo}</div>
              <div class="text-lg font-bold">${o.amount} ${o.asset} <span class="text-gray-500 text-sm">≈ ${fmtINR(o.totalPrice)}</span></div>
            </div>
            <div class="text-right space-y-1">
              ${o.orderStatus === 1
                ? badge(o.orderStatusText, 'amber')
                : o.orderStatus === 2
                  ? badge(o.orderStatusText + ' (already paid)', 'blue')
                  : badge(o.orderStatusText, 'gray')}
              ${o.botState ? badge('BOT: ' + o.botState, 'purple') : ''}
            </div>
          </div>
          <div class="grid grid-cols-2 gap-2 text-sm mb-3">
            <div><span class="text-gray-500">Seller:</span> ${o.sellerName || o.sellerNickname || '—'}</div>
            <div><span class="text-gray-500">Type:</span> ${o.tradeType}</div>
            <div><span class="text-gray-500">Started:</span> ${fmtTime(o.createTime)}</div>
            <div><span class="text-gray-500">Pay deadline:</span> ${fmtTime(o.confirmPayEndTime)} <span class="text-xs text-gray-500">${relTime(o.confirmPayEndTime)}</span></div>
            ${o.panMasked ? `<div><span class="text-gray-500">Bot saw PAN:</span> <span class="font-mono">${o.panMasked}</span></div>` : ''}
            ${o.panRetries ? `<div><span class="text-gray-500">PAN retries:</span> ${o.panRetries}</div>` : ''}
            ${o.chatUnreadCount ? `<div><span class="text-gray-500">Unread chat:</span> ${o.chatUnreadCount}</div>` : ''}
          </div>
          <div class="flex justify-end">
            ${o.isCancellable
              ? `<button data-cancel="${o.orderNo}" class="bg-red-600 hover:bg-red-700 active:bg-red-800 px-4 py-2 rounded text-sm font-medium">⚠ Cancel</button>`
              : `<span class="text-xs text-gray-500 italic">Cancel not allowed (status ${o.orderStatus})</span>`}
          </div>
        </div>
      `).join('');

      // Wire cancel buttons
      wrap.querySelectorAll('[data-cancel]').forEach(btn => {
        btn.addEventListener('click', () => openCancelModal(btn.dataset.cancel));
      });
    }

    function openCancelModal(orderNo) {
      state.activeOrderNo = orderNo;
      $('#modalOrderNo').textContent = orderNo;
      $('#reasonCode').value = '6';
      $('#additionalInfo').value = 'No response from seller — Manual cancel via dashboard';
      updateReasonHint();
      $('#cancelModal').classList.remove('hidden');
    }
    function closeCancelModal() {
      $('#cancelModal').classList.add('hidden');
      state.activeOrderNo = null;
    }

    function updateReasonHint() {
      const code = parseInt($('#reasonCode').value, 10);
      const isBuyer = [1, 2, 5].includes(code);
      $('#reasonHint').textContent = isBuyer
        ? '⚠ This is a "Due to buyer" reason — your cancellation rate WILL be impacted.'
        : '✅ "Due to seller" reason — no impact on your rate. Seller may need to accept.';
      $('#reasonHint').className = isBuyer
        ? 'text-xs text-amber-400 mb-4'
        : 'text-xs text-emerald-400 mb-4';
    }

    async function confirmCancel() {
      const orderNo = state.activeOrderNo;
      if (!orderNo) return;
      const reasonCode = parseInt($('#reasonCode').value, 10);
      const additionalInfo = $('#additionalInfo').value.trim();
      const btn = $('#modalConfirmBtn');
      btn.disabled = true;
      btn.textContent = 'Cancelling…';
      try {
        const r = await fetch(`/api/orders/${orderNo}/cancel`, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ reasonCode, additionalInfo }),
        }).then(r => r.json());
        if (!r.success) throw new Error(r.error);
        toast(`✅ Cancelled (${r.category})`, 'emerald');
        closeCancelModal();
        loadOrders();
      } catch (e) {
        toast('❌ Cancel failed: ' + e.message, 'red');
      } finally {
        btn.disabled = false;
        btn.textContent = '⚠ Confirm Cancel';
      }
    }

    function toast(msg, color) {
      const el = $('#toast');
      el.className = `fixed bottom-6 right-6 bg-gray-800 border-l-4 border-${color}-500 px-4 py-3 rounded shadow-2xl max-w-md text-sm z-50`;
      el.textContent = msg;
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 6000);
    }

    // ── Wire UI ──────────────────────────────────────────────────────────
    $('#refreshBtn').addEventListener('click', () => { loadHealth(); loadOrders(); });
    $('#modalCloseBtn').addEventListener('click', closeCancelModal);
    $('#modalConfirmBtn').addEventListener('click', confirmCancel);
    $('#reasonCode').addEventListener('change', updateReasonHint);
    $('#cancelModal').addEventListener('click', e => { if (e.target.id === 'cancelModal') closeCancelModal(); });

    // Auto-refresh every 10s
    loadHealth(); loadOrders();
    setInterval(() => { loadHealth(); loadOrders(); }, 10_000);
  </script>
</body>
</html>
